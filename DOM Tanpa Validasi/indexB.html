<!DOCTYPE html> 
<html lang="id"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Pendaftaran Workshop</title> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head> 
<body class="bg-body-tertiary"> 
  <main class="container py-5" style="max-width: 540px;"> 

    <div class="card shadow-sm"> 
      <div class="card-body p-4"> 
        <h1 class="h3 mb-4">Pendaftaran Workshop (DOM tanpa Validasi)</h1> 

        <form id="formDaftar" novalidate> 
          <div class="mb-3"> 
            <label for="nama" class="form-label">Nama lengkap</label> 
            <input id="nama" type="text" class="form-control" placeholder="Contoh: Andi Pratama"> 
            <div id="nama-error" class="invalid-feedback"></div> 
          </div>

          <div class="mb-4"> 
            <label for="email" class="form-label">Email</label> 
            <input id="email" type="email" class="form-control" placeholder="nama@domain.com"> 
            <div id="email-hint" class="form-text">Contoh: nama@domain.com</div> 
            <div id="email-error" class="invalid-feedback"></div> 
          </div> 

          <button type="submit" class="btn btn-primary w-100">Simpan</button> 
        </form> 
      </div> 
    </div> 

    <div class="card shadow-sm mt-4"> 
      <div class="card-body p-4"> 
        <h2 class="h5 mb-3">Daftar peserta</h2> 
        <ul id="daftar" class="list-group"></ul> 
      </div> 
    </div> 

  </main>

  <script src="scriptB.js"></script> 
</body> 
</html>
